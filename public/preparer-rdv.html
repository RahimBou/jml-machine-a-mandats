<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JML Immobilier — Préparer mon rendez-vous</title><link rel="stylesheet" href="/styles.css?v=1.8.0"><style>body{min-height:100vh;background:var(--cream)}.wrap{max-width:760px;margin:0 auto;padding:28px 18px 50px}.head{background:var(--green);color:#fff;border-radius:16px;padding:28px;margin-bottom:18px}.head small{color:#d8bb7a;letter-spacing:.08em}.head h1{margin:8px 0}.head p{color:#dce5df;line-height:1.6}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}.field{margin:18px 0}.field label{display:block;font-weight:700;color:var(--green);margin-bottom:7px}.field select,.field input{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px}.result{display:none;margin-top:22px;background:#f5f1e8;border:1px solid var(--line);border-radius:16px;padding:20px}.result h2{color:var(--green);margin-top:0}.result li{line-height:1.6;margin:7px 0}.actions{margin-top:22px}.actions button,.actions a{padding:11px 15px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--green);font-weight:600;text-decoration:none;cursor:pointer;margin-right:8px}@media print{.actions,.form-area{display:none}.result{display:block}body{background:#fff}}</style></head><body><main class="wrap"><section class="head"><small>JML IMMOBILIER · PRÉPARATION DU RENDEZ-VOUS</small><h1>Préparer mon rendez-vous</h1><p>Quelques réponses suffisent pour faire apparaître les points utiles à préparer avant notre échange.</p></section><section class="card"><div class="form-area"><div class="field"><label for="type">Votre bien</label><select id="type"><option>Maison</option><option>Appartement</option><option>Immeuble</option><option>Terrain</option><option>Autre</option></select></div><div class="field"><label for="horizon">Votre projet</label><select id="horizon"><option>Dans les 3 mois</option><option>Dans 3 à 6 mois</option><option>Dans 6 à 12 mois</option><option>Plus tard / réflexion</option></select></div><div class="field"><label for="city">Votre commune</label><input id="city" maxlength="80" placeholder="Ex. Charleville-Mézières"></div><button id="prepare" class="actions">Voir ma préparation</button></div><div id="result" class="result"></div><div class="actions"><button onclick="window.print()">🖨️ Imprimer / enregistrer en PDF</button><a href="/projet-vendeur">← Retour à votre espace vendeur</a></div></section></main><script>
const params=new URLSearchParams(location.search);
const type=document.getElementById('type'),horizon=document.getElementById('horizon'),city=document.getElementById('city'),result=document.getElementById('result');
if(params.get('type'))type.value=params.get('type');
if(params.get('horizon')){const map={'0-3':'Dans les 3 mois','3-6':'Dans 3 à 6 mois','6-12':'Dans 6 à 12 mois','unknown':'Plus tard / réflexion'};horizon.value=map[params.get('horizon')]||params.get('horizon');}
if(params.get('city'))city.value=params.get('city');

function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});}

document.getElementById('prepare').addEventListener('click',async()=>{
 const t=type.value,h=horizon.value,c=city.value.trim();
 let items=[];
 items.push('Préparer les informations principales du bien et ses caractéristiques.');
 if(t==='Maison')items.push('Noter les surfaces, extérieurs, dépendances, stationnement et principaux équipements.');
 if(t==='Appartement')items.push('Préparer les informations de copropriété, charges, étage, ascenseur et stationnement si concernés.');
 if(t==='Immeuble')items.push('Rassembler les informations disponibles sur les lots, surfaces, occupation et éventuels revenus ou documents utiles.');
 if(t==='Terrain')items.push('Préparer les informations disponibles sur la surface, la localisation, les accès et les documents d’urbanisme que vous possédez.');
 if(t==='Autre')items.push('Préparer les principales caractéristiques propres à votre bien.');
 if(h==='Dans les 3 mois')items.push('Préparer dès maintenant les documents et questions utiles, car votre calendrier est proche.');
 if(h==='Dans 3 à 6 mois')items.push('Profiter du délai pour réunir progressivement les documents et faire le point sur les éventuels travaux.');
 if(h==='Dans 6 à 12 mois')items.push('Utiliser ce rendez-vous pour clarifier le calendrier et identifier les informations à préparer dans les prochains mois.');
 if(h==='Plus tard / réflexion')items.push('Venir surtout avec vos questions : le rendez-vous peut servir à comprendre le marché et les étapes sans engager de décision immédiate.');
 if(c)items.push('Préparer vos questions sur le secteur de '+c+' et les repères de marché que vous souhaitez comprendre.');
 items.push('Apporter le DPE, les diagnostics, la taxe foncière et les documents disponibles sur le bien.');

 result.innerHTML='<h2>Votre préparation</h2><ul>'+items.map(x=>'<li>✓ '+esc(x)+'</li>').join('')+'</ul><div id="marketResult" style="margin-top:18px"></div><p><strong>À retenir :</strong> cette préparation est un support pour notre échange. Elle ne constitue pas une estimation du bien.</p>';
 result.style.display='block';

 const market=document.getElementById('marketResult');
 if(c){
   market.innerHTML='<p><strong>📍 Repère local</strong><br>Recherche du repère DVF de '+esc(c)+'…</p>';
   try{
     const response=await fetch('/api/commune-market?city='+encodeURIComponent(c),{cache:'no-store'});
     const data=await response.json();
     if(data.found){
       market.innerHTML='<div style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px"><strong style="color:var(--green)">📍 '+esc(data.city)+'</strong><div style="font-size:24px;font-weight:700;margin:6px 0">'+Number(data.price).toLocaleString('fr-FR')+' €/m²</div><div style="font-size:12px;color:var(--muted)">'+esc(data.source)+' · '+esc(data.period)+'</div><p style="font-size:12px;line-height:1.5;margin:10px 0 0">'+esc(data.message)+' '+esc(data.caution)+'</p><a href="'+esc(data.sourceUrl)+'" target="_blank" rel="noopener" style="font-size:11px;color:#6f592b">Voir la source →</a></div>';
     }else{
       market.innerHTML='<div style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px"><strong style="color:var(--green)">📍 '+esc(data.city)+'</strong><p style="font-size:12px;line-height:1.5;margin:8px 0">'+esc(data.message)+'</p><div style="font-size:12px;color:var(--muted)">Repère Ardennes : '+Number(data.department.median).toLocaleString('fr-FR')+' €/m² tous logements · '+Number(data.department.house).toLocaleString('fr-FR')+' €/m² maison · '+Number(data.department.apartment).toLocaleString('fr-FR')+' €/m² appartement.</div><a href="'+esc(data.sourceUrl)+'" target="_blank" rel="noopener" style="font-size:11px;color:#6f592b">Voir la source →</a></div>';
     }
   }catch(e){
     market.innerHTML='<p style="font-size:12px;color:var(--muted)">Le repère communal n’est pas disponible pour le moment. Les autres éléments de préparation restent disponibles.</p>';
   }
 }
 result.scrollIntoView({behavior:'smooth',block:'start'});
});
</script></body></html>
