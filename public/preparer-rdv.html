<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JML Immobilier — Préparer mon rendez-vous</title><link rel="stylesheet" href="/styles.css?v=1.8.0"><style>body{min-height:100vh;background:var(--cream)}.wrap{max-width:760px;margin:0 auto;padding:28px 18px 50px}.head{background:var(--green);color:#fff;border-radius:16px;padding:28px;margin-bottom:18px}.head small{color:#d8bb7a;letter-spacing:.08em}.head h1{margin:8px 0}.head p{color:#dce5df;line-height:1.6}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}.field{margin:18px 0}.field label{display:block;font-weight:700;color:var(--green);margin-bottom:7px}.field select,.field input{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px}.result{display:none;margin-top:22px;background:#f5f1e8;border:1px solid var(--line);border-radius:16px;padding:20px}.result h2{color:var(--green);margin-top:0}.result li{line-height:1.6;margin:7px 0}.actions{margin-top:22px}.actions button,.actions a{padding:11px 15px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--green);font-weight:600;text-decoration:none;cursor:pointer;margin-right:8px}@media print{.actions,.form-area{display:none}.result{display:block}body{background:#fff}}</style></head><body><main class="wrap"><section class="head"><small>JML IMMOBILIER · PRÉPARATION DU RENDEZ-VOUS</small><h1>Préparer mon rendez-vous</h1><p>Quelques réponses suffisent pour faire apparaître les points utiles à préparer avant notre échange.</p></section><section class="card"><div class="form-area"><div class="field"><label for="type">Votre bien</label><select id="type"><option>Maison</option><option>Appartement</option><option>Immeuble</option><option>Terrain</option><option>Autre</option></select></div><div class="field"><label for="horizon">Votre projet</label><select id="horizon"><option>Dans les 3 mois</option><option>Dans 3 à 6 mois</option><option>Dans 6 à 12 mois</option><option>Plus tard / réflexion</option></select></div><div class="field"><label for="city">Votre commune</label><input id="city" maxlength="80" placeholder="Ex. Charleville-Mézières"></div><button id="prepare" class="actions">Voir ma préparation</button></div><div id="result" class="result"></div><div class="actions"><button onclick="window.print()">🖨️ Imprimer / enregistrer en PDF</button><a href="/projet-vendeur">← Retour à votre espace vendeur</a></div></section></main><script>const type=document.getElementById('type'),horizon=document.getElementById('horizon'),city=document.getElementById('city'),result=document.getElementById('result');document.getElementById('prepare').addEventListener('click',()=>{const t=type.value,h=horizon.value,c=city.value.trim();let items=[];items.push('Préparer les informations principales du bien et ses caractéristiques.');if(t==='Maison')items.push('Noter les surfaces, extérieurs, dépendances, stationnement et principaux équipements.');if(t==='Appartement')items.push('Préparer les informations de copropriété, charges, étage, ascenseur et stationnement si concernés.');if(t==='Immeuble')items.push('Rassembler les informations disponibles sur les lots, surfaces, occupation et éventuels revenus ou documents utiles.');if(t==='Terrain')items.push('Préparer les informations disponibles sur la surface, la localisation, les accès et les documents d’urbanisme que vous possédez.');if(t==='Autre')items.push('Préparer les principales caractéristiques propres à votre bien.');if(h==='Dans les 3 mois')items.push('Préparer dès maintenant les documents et questions utiles, car votre calendrier est proche.');if(h==='Dans 3 à 6 mois')items.push('Profiter du délai pour réunir progressivement les documents et faire le point sur les éventuels travaux.');if(h==='Dans 6 à 12 mois')items.push('Utiliser ce rendez-vous pour clarifier le calendrier et identifier les informations à préparer dans les prochains mois.');if(h==='Plus tard / réflexion')items.push('Venir surtout avec vos questions : le rendez-vous peut servir à comprendre le marché et les étapes sans engager de décision immédiate.');if(c)items.push('Préparer vos questions sur le secteur de '+c+' et les repères de marché que vous souhaitez comprendre.');items.push('Apporter le DPE, les diagnostics, la taxe foncière et les documents disponibles sur le bien.');result.innerHTML='<h2>Votre préparation</h2><ul>'+items.map(x=>'<li>✓ '+x+'</li>').join('')+'</ul><p><strong>À retenir :</strong> cette préparation est un support pour notre échange. Elle ne constitue pas une estimation du bien.</p>';result.style.display='block';result.scrollIntoView({behavior:'smooth',block:'start'})});</script></body></html>
