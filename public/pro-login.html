<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connexion · Espace professionnel JML</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#111916,#1d2924);display:grid;place-items:center;color:#f6f1e8;padding:24px}
.card{width:min(430px,100%);background:#f8f5ee;color:#17211d;border-radius:24px;padding:34px;box-shadow:0 24px 70px #0008}
.logo{width:62px;height:62px;border-radius:16px;background:#17352b;color:#d7b56d;display:grid;place-items:center;font-weight:800;font-size:22px;margin-bottom:22px}
h1{margin:0 0 8px;font-size:27px}
p{color:#65706a;line-height:1.5;margin:0 0 24px}
label{display:block;font-weight:700;font-size:14px;margin-bottom:8px}
input{width:100%;padding:14px 15px;border:1px solid #d6d0c5;border-radius:12px;font-size:16px;outline:none;background:#fff;color:#17211d;color-scheme:light}
input:focus{border-color:#9a7a3b;box-shadow:0 0 0 3px #9a7a3b22}
button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:#17352b;color:white;font-weight:800;font-size:16px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.error{display:none;margin-top:14px;padding:11px 12px;border-radius:10px;background:#fbe7e5;color:#8b2920;font-size:14px}
.footer{margin-top:22px;text-align:center;font-size:12px;color:#8a8f8a}
</style>
</head>
<body>
<main class="card">
  <div class="logo">JML</div>
  <h1>Espace professionnel</h1>
  <p>Connectez-vous pour accéder à vos prospects, rendez-vous, activités et à Google Calendar.</p>
  <form id="loginForm">
    <label for="password">Mot de passe professionnel</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button id="submit" type="submit">Se connecter</button>
    <div id="error" class="error"></div>
  </form>
  <div class="footer">JML Immobilier · Espace sécurisé</div>
</main>
<script>
const form=document.getElementById("loginForm");
const password=document.getElementById("password");
const button=document.getElementById("submit");
const error=document.getElementById("error");
form.addEventListener("submit",async e=>{
  e.preventDefault();
  error.style.display="none";
  button.disabled=true;
  try{
    const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({password:password.value})});
    let d={};try{d=await r.json()}catch{}
    if(!r.ok) throw new Error(d.error||"Connexion impossible.");
    window.location.replace("/espace-pro");
  }catch(err){
    error.textContent=err.message||"Connexion impossible.";
    error.style.display="block";
    password.select();
  }finally{button.disabled=false}
});
</script>
</body>
</html>
