<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JML Immobilier — Guide vendeur</title><link rel="stylesheet" href="/styles.css"></head><body><main style="max-width:900px"><div class="card"><div class="eyebrow">JML Immobilier · Ardennes</div><h1>Les 10 erreurs à éviter avant de vendre votre maison</h1><p class="muted">Un guide pratique pour préparer une vente.</p><div id="guideItems"></div></div><div class="card section"><h2>Recevoir le guide et être recontacté</h2><form id="leadForm" class="form"><div><label>Nom / prénom *</label><input name="name" required></div><div><label>Commune</label><input name="city"></div><div><label>Email</label><input name="email" type="email"></div><div><label>Téléphone</label><input name="phone"></div><div><label>Type de bien</label><select name="propertyType"><option>Maison</option><option>Appartement</option><option>Immeuble</option><option>Terrain</option><option>Autre</option></select></div><div><label>Projet</label><select name="horizon"><option value="0-3">0–3 mois</option><option value="3-6">3–6 mois</option><option value="6-12">6–12 mois</option><option value="12+">Plus de 12 mois</option><option value="unknown">Je ne sais pas encore</option></select></div><div class="full"><label><input type="checkbox" name="consent" value="true" required style="width:auto"> J’accepte que JML Immobilier utilise mes coordonnées pour me recontacter au sujet de mon projet immobilier. *</label></div><input type="hidden" name="source" value="Lead Magnet"><div class="full"><button class="primary" type="submit">Recevoir le guide</button></div><div id="leadMessage" class="notice full" hidden></div></form></div></main><script>const items=["Fixer le prix au feeling","Copier le prix d'une annonce","Négliger le secteur","Faire des travaux sans calculer","Oublier le DPE","Attendre le dernier moment","Sous-estimer les photos","Ne pas préparer les documents","Changer de prix trop vite","Rester seul face au marché"];document.querySelector("#guideItems").innerHTML=items.map((x,i)=>"<div class='idea'><strong>"+(i+1)+". "+x+"</strong><span class='muted'>À vérifier avant de mettre un bien sur le marché.</span></div>").join("");document.querySelector("#leadForm").addEventListener("submit",async e=>{e.preventDefault();const box=document.querySelector("#leadMessage");try{const r=await fetch("/api/leads",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget).entries()))});const x=await r.json();if(!r.ok)throw new Error(x.error);box.hidden=false;box.textContent="Votre demande a bien été enregistrée.";e.currentTarget.reset()}catch(err){box.hidden=false;box.textContent=err.message||"Erreur."}});</script></body></html>
