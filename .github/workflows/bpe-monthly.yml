name: BPE mensuel

on:
  push:
    paths:
      - "scripts/import-bpe.js"
      - "data/BPE25_Ardennes.csv"
      - ".github/workflows/bpe-monthly.yml"
  schedule:
    - cron: "45 4 1 * *"
  workflow_dispatch:

jobs:
  import-bpe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - name: Importer le BPE 2025 Ardennes depuis le fichier local

        run: node scripts/import-bpe.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: "true"
